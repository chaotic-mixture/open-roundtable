[build-system]
# No installer/build dependency downloads. Publishing is intentionally blocked.
requires = []
build-backend = "open_roundtable._build_disabled"
backend-path = ["."]

[project]
name = "open-roundtable"
version = "0.0.3"
description = "SQLite roundtable kernel with local Ollama schedule consultation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
# Explicit whitelist for a future, separately audited packaging backend.
# This configuration does not claim that sdist/wheel publication is supported.
packages = ["open_roundtable"]
include-package-data = false

[tool.open-roundtable]
phase = "phase-1-local-consult"
publication-supported = false
budget-unit = "local test credits"
